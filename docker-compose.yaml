# set project name after build
name: discodeit
services:

  # database container
  db:
    image: postgres:16
    hostname: db
    container_name: db
    # set env defined in image
    # user is default
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul

    # health check
    # postgres:16 has own health check command
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 3s
      retries: 10

    # db data save in bind volume
    # postgresql default file data.
    volumes:
      - db:/var/lib/postgresql/data
      # sql init scripts - /docker-entrypoint-initdb.d/*.sql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql


    # define same network with application server
    networks:
      - br

  # kafka
  broker:
    image: apache/kafka:latest
    hostname: kafka
    container_name: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - br

  # redis
  redis:
    image: redis:7.2-alpine
    hostname: redis
    container_name: redis
    volumes:
      - redis_data:/data
    networks:
      - br

  # discodeit
  app:
    build:
      # work dir is current dir
      context: .
      dockerfile: Dockerfile
    hostname: discodeit
    container_name: discodeit
    # export port for outside of host

    # env for application.yaml and others
    environment:
      # jvm options mem 200mb~400mb
      - JVM-OPTS=-Xmx400m -Xms200m
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USER=${SPRING_DATASOURCE_USER}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      # storage type config
      - STORAGE_TYPE=${STORAGE_TYPE}
      - STORAGE_LOCAL_ROOT_PATH=${STORAGE_LOCAL_ROOT_PATH}
      # s3 config
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_PRESIGN_TIME=${S3_PRESIGN_TIME}
      # default setting
      - DISCODEIT_PORT=${DISCODEIT_PORT}
      - PROFILE=${PROFILE}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - KAFKA_URL=${KAFKA_URL}

    depends_on:
      db:
        condition: service_healthy # wait db was healthy

    # set bin data volume
    # todo - change to variable with env
    volumes:
      - app:${STORAGE_LOCAL_ROOT_PATH}

    # same network with db
    networks:
      - br

  # nginx (reverse proxy)
  proxy:
    image: nginx:alpine
    hostname: proxy
    container_name: proxy
    ports:
      - "443:443"
      - "3000:80" # 사양지시서 기재 포트
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/cert:/etc/nginx/certs:ro
      - ./nginx/static:/etc/nginx/static:ro
    depends_on:
      - app
    networks:
      - br


volumes:
  db:
    driver: local # auto bind in host space
  app:
    driver: local
  redis_data:
    driver: local


networks:
  br:
    driver: bridge