# 지속적 통합(CI)을 위한 워크플로우 정의

name: ci

# 트리거: 언제 이 워크플로우를 실행할지 정의
on:
  pull_request:
    branches: [ "main" ] # main 브랜치로 PR이 생성될 때 실행
  workflow_dispatch: # 수동으로 실행 가능 (Actions 탭에서 직접 "Run workflow" 버튼 클릭)

# 할 일 묶음(여러 개 병렬 가능)
jobs:
  # 1. 빌드 + 테스트 (CI의 핵심)
  build:
    runs-on: ubuntu-latest # 깃허브가 빌려주는 리눅스 운영체제 러너
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7 # 내 깃허브 레파지토리에서 코드를 가져오기 위한 액션

      - name: JDK 17 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 빌드 + 테스트
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Codecov 업로드
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/jacoco/test/jacocoTestReport.xml
          flags: backend
          disable_search: true
          fail_ci_if_error: true