name: deploy.yml
on:
  pull_request:
    branches:
      - "release"
  workflow_dispatch: # manually actions

env:
  # target task definition for upload
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}


jobs:
  # ECR image make and push server
  ecr_push:
    runs-on: ubuntu-latest
    steps:
      - name: pulling code
        uses: actions/checkout@v7

      # set up aws cli
      - name: aws certification
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # OIDC type
#      - name: AWS 자격증명 (OIDC 역할 assume - 키 없음)
#        uses: aws-actions/configure-aws-credentials@v6
#        with:
#          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
#          aws-region: us-east-1


      # login public ECR
      # outputs
      # - registry - accessed public ecr registry address ( = Repository uri )
      # - docker_username , docker_password(Tempo token)
      - name: ECR login on public
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public


      # image build
      - name: set build tools
        uses: docker/setup-buildx-action@v4

      - name: build image and push
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            --push .



  # ECS service on
  ecs_update:
    needs: ecr_push
    runs-on: ubuntu-latest
    steps:
      - name: aws certification
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # task definition update
      # jq command ->  remove filed what is not registrable(read only field => occur error).
      - name: 현재 작업 정의(task definition) 내려받기
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition > task-definition.json
          
          jq 'del(
            .taskDefinitionArn, .revision, .status, .requiresAttributes,
            .compatibilities, .registeredAt, .registeredBy, .enableFaultInjection
          )' task-definition.json > task-definition-clean.json
               
          mv task-definition-clean.json task-definition.json

      # save new task definition to json file
      - name: 작업 정의에 새 이미지 반영
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER }}
          image: ${{ steps.build-image.outputs.image }}

      - name: ECS 배포
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true   # 새 태스크가 안정될 때까지 기다림(성공 확인)
