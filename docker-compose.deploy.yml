# 외부 진입점은 Nginx의 3000번 포트 하나이며 앱과 인프라는 서비스 이름으로 통신한다.
name: discodeit-deploy

services:

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile

    restart: unless-stopped

    ports:
      - "3000:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - proxy-network

  app:
    # 같은 앱 이미지로 두 인스턴스를 실행한다. 인스턴스별 연결은 로컬에, 공유 상태는 Redis에 둔다.
    deploy:
      replicas: 2
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME:-discodeit}
        PROJECT_VERSION: ${PROJECT_VERSION:-1.2-M8}

    restart: unless-stopped

    # 로컬 환경 파일에서 값을 주입한다. 비밀 값은 Compose 파일이나 이미지에 직접 기록하지 않는다.
    env_file:
      - .env

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "80"

      DB_HOST: postgres
      DB_PORT: "5432"

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # Kafka 접속 주소만 준비한 상태다. 현재 실시간 이벤트 전파 구현은 Redis Pub/Sub을 사용한다.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STORAGE_LOCAL_ROOT_PATH: /app/storage

      # 이번 구성은 HTTP 3000번 포트로 접근
      REFRESH_COOKIE_SECURE: "false"

    volumes:
      - binary-data:/app/storage

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - proxy-network
      - internal-network

  # DB·Redis·Kafka는 호스트 포트를 공개하지 않고 internal-network에서만 앱과 통신한다.
  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Asia/Seoul}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - internal-network
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped

    # 컨테이너 교체 후에도 Redis 데이터를 복구할 수 있도록 AOF와 영속 볼륨을 사용한다.
    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    networks:
      - internal-network
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped

    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      # KRaft 단일 노드 실습 구성으로 브로커와 컨트롤러를 같은 컨테이너에서 실행한다.
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-topics.sh
        - --bootstrap-server
        - kafka:9092
        - --list
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

    networks:
      - internal-network

# 컨테이너 재생성과 데이터 삭제를 분리한다. down -v는 이 볼륨 데이터도 삭제하므로 구분한다.

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  binary-data:

networks:
  proxy-network:
    driver: bridge

  # 인프라 네트워크의 외부 라우팅을 차단한다. 앱은 프록시 연결을 위해 두 네트워크에 참여한다.
  internal-network:
    driver: bridge
    internal: true
