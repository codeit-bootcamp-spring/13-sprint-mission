map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# SockJS 세션 ID 추출
map $uri $sockjs_route_key {
    ~^/ws/[^/]+/([^/]+)/ $1;
    default $remote_addr;
}

# 일반 HTTP 요청: 라운드 로빈
upstream discodeit_http {
    zone discodeit_http 64k;

    server app:80;
    server app2:80;
    server app3:80;
}

# WebSocket/SockJS: 세션별 동일 서버 유지
upstream discodeit_ws {
    hash $sockjs_route_key consistent;

    server app:80;
    server app2:80;
    server app3:80;
}

log_format upstream_log
    '$remote_addr "$request" '
    'status=$status upstream=$upstream_addr';

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream_log;
    server_name localhost;

    # WebSocket / SockJS
    location /ws {
        proxy_pass http://discodeit_ws;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
    }

    # SSE 실시간 알림
    location = /api/sse {
        proxy_pass http://discodeit_http;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }


    # REST API는 Spring Boot로 전달
    location /api/ {
        proxy_pass http://discodeit_http;
        proxy_http_version 1.1;

        proxy_connect_timeout 1s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 프론트엔드는 Nginx가 직접 제공
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
