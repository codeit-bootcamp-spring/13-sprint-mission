# WebSocket 업그레이드 요청과 SockJS 일반 HTTP 요청의 Connection 값을 구분한다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# SockJS의 여러 HTTP 요청을 세션 ID로 같은 백엔드에 보낸다. 세션 ID가 없으면 클라이언트 IP를 쓴다.
map $uri $sockjs_route_key {
    ~^/ws/[^/]+/(?<sockjs_session_id>[^/]+)/ $sockjs_session_id;
    default $remote_addr;
}

# 일반 API는 기본 Round Robin으로 분산한다. app 이름으로 해석된 백엔드 주소들을 사용한다.
# 현재 정적 이름 해석 설정이므로 앱 재생성으로 IP가 바뀌면 Nginx도 재기동해 주소를 갱신한다.
upstream backend {
    server app:80;
}

# SockJS 세션 상태는 각 앱 메모리에 있으므로 같은 세션의 전송 요청은 같은 앱으로 보낸다.
upstream websocket_backend {
    hash $sockjs_route_key;
    server app:80;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # /api/sse도 이 경로를 사용한다. 응답 버퍼를 끄고 긴 읽기 제한을 두어 이벤트를 즉시 전달한다.
    location /api/ {
        proxy_pass http://backend;
        # 브라우저 개발자 도구에서 실제 처리 인스턴스를 비교하기 위한 응답 헤더다.
        add_header X-Upstream-Server $upstream_addr always;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # /ws와 하위 SockJS 경로를 모두 전달하며 HTTP/1.1 Upgrade 헤더로 WebSocket 전환을 지원한다.
    location ~ ^/ws(/|$) {
        proxy_pass http://websocket_backend;
        # 브라우저 개발자 도구에서 실제 처리 인스턴스를 비교하기 위한 응답 헤더다.
        add_header X-Upstream-Server $upstream_addr always;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # 실제 파일은 그대로 제공하고 클라이언트 라우팅 주소는 SPA 진입 문서로 연결한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
