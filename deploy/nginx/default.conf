# 로드밸런싱 방식은 아래 upstream에서 선택합니다. 기본값은 Round Robin입니다.
upstream backend_pool {
    zone backend_pool 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Least Connections를 사용하려면 다음 줄의 주석을 해제합니다.
    # least_conn;
    # IP Hash를 사용하려면 다음 줄의 주석을 해제합니다. least_conn과 동시에 사용하지 않습니다.
    # ip_hash;

    server backend:80 resolve;

    # Weight 3:1 비교 시 위 server 줄을 주석 처리하고 아래 두 줄을 활성화합니다.
    # compose.balance-weight.yml을 함께 실행해야 backend_weighted가 생성됩니다.
    # server backend:80 resolve weight=3;
    # server backend_weighted:80 resolve weight=1;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/sse {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3700s;
        add_header X-Upstream-Server $upstream_addr always;
        add_header X-Accel-Buffering no always;
    }
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_set_header Host $http_host;
        add_header X-Upstream-Server $upstream_addr always;
        client_max_body_size 20m;
    }
    location ~ ^/ws(?:/|$) {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 3700s;
        add_header X-Upstream-Server $upstream_addr always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
