spring:
  application:
    name: discodeit
  datasource:
    url: jdbc:postgresql://smb.docklas.com:55432/discodeit
    username: discodeit_user
    password: discodeit1234
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB



logging:
  level:
    root: INFO
    org.hiberate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO


discodeit:
  repository:
    type: jcf
    path: "/home/latte/test"
  storage:
    type: "local"
    local:
      root-path: "data"





