spring:
  application:
    name: discodeit

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  profiles:
    active: dev


discodeit:
  repository:
    type: jcf     # jcf | file
    file-directory: data

  storage:
    type: local
    local:
      root-path: storage

logging:
  level:
    com.sprintlog: info

