spring:
  application:
    name: discodeit

  # 프로젝트 루트의 .env 파일을 properties 형식으로 불러옵니다.
  # .env 파일이 없는 테스트·ECS 환경에서도 실행되도록 optional로 설정합니다.
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  boot:
    admin:
      client:
        instance:
          name: discodeit

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

logging:
  level:
    root: info

discodeit:
  repository:
    type: ${REPOSITORY_TYPE:jpa}

  storage:
    # local 또는 s3로 저장소 구현체를 전환합니다.
    type: ${STORAGE_TYPE:local}

    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:data/binaryContents}

    s3:
      region: ${AWS_S3_REGION:ap-northeast-2}
      bucket: ${AWS_S3_BUCKET:discodeit-binary-content-storage-jhs}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}

  file-directory: ${FILE_DIRECTORY:data}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - loggers

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true

info:
  application:
    name: Discodeit
    version: 1.2-M8
    java-version: 17
    spring-boot-version: 3.5.14

  datasource:
    url: ${spring.datasource.url:설정되지 않음}
    driver-class-name: ${spring.datasource.driver-class-name:org.postgresql.Driver}

  jpa:
    ddl-auto: ${spring.jpa.hibernate.ddl-auto:none}

  storage:
    type: ${discodeit.storage.type:local}
    local-path: ${discodeit.storage.local.root-path:data/binaryContents}
    s3-region: ${discodeit.storage.s3.region:ap-northeast-2}
    s3-bucket: ${discodeit.storage.s3.bucket:설정되지 않음}
    presigned-url-expiration: ${discodeit.storage.s3.presigned-url-expiration:600}

  multipart:
    max-file-size: ${spring.servlet.multipart.max-file-size:10MB}
    max-request-size: ${spring.servlet.multipart.max-request-size:30MB}