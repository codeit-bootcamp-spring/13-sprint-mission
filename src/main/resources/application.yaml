# Spring config
spring:
  application:
    name: ${PROJECT_NAME:discodeit}
    version: ${PROJECT_VERSION:1.0.0}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  profiles:
    active: ${PROFILE:prod}

  # .sql 파일을 이용하지 않고, hibernate 가 DDL 을 작성하도록 설정.
  sql:
    init:
      mode: never

  # Actuator 조회시, 초기 Spring 세팅시 캐시가 세팅되지 않으면 조회가 안 되기 때문에
  # 이름을 미리 지정해서 Actuator 조회 가능하게 함.
  cache:
    cache-names:
      - user
      - channel
      - notification


  # kafka 설정.
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: discodeit-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer



# Server port.
# set 80 fix in docker container
server:
  port: 8080


# Custom setting
discodeit:
  storage:
    type: ${STORAGE_TYPE:local}

    # root path for type "local"
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}

    # aws config for type "s3"
    aws:
      s3:
        bucket: ${S3_BUCKET}
        region: ${S3_REGION}
        endpoint: ${S3_ENDPOINT:}
        presign-time: ${S3_PRESIGN_TIME:5}


  jwt:
    secret: "json-token-secret-123-4567-789-tileup"
    refresh-expired-date: 14 # 14 일
    access-token-validate: 15 # 15 분

  cache:
    #캐시 사이즈
    max-size: 500
    #수명(초)
    ttl-seconds: 60


springdoc:
#  packages-to-scan: com.sprint.mission.discodeit.controller.docs
  api-docs:
    path: /swagger-doc

### Actuator 관련 설정. ###

# Actuator config
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers, caches # 꼭 필요한 정보만 노출
      base-path: /management # 경로도 바꿔서 숨김

  endpoint:
    health:
      show-details: always # 개발 환경에서는 always, 운영에서는 when-authorized(허가된 사람만 요청 가능하도록)
  info:
    env:
      enabled: true
  server:
    port: 59090 # Actuator 전용 포트 (방화벽 같은데에서 Actuator는 허용된 ip만 접근이 가능하도록 막음)

  observations:
    annotations:
      enabled: true

# Actuator into
info:
  application:
    name: ${spring.application.name}
    version: ${spring.application.version}
    java-version: "17"
    spring-boot-version: "3.4.0"

  configuration:
    datasource:
      url: ${spring.datasource.url}
    #      driver-class-name: ${spring.datasource.driver-class-name}

    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto}

    storage:
      type: ${discodeit.storage.type}
      path: ${discodeit.storage.local.root-path}

    multipart:
      max-file-size: ${spring.servlet.multipart.max-file-size}
      max-request-size: ${spring.servlet.multipart.max-request-size}

