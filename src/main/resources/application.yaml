spring:
  application:
    name: discodeit
  profiles:
    active: dev
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    root: info
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

discodeit:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      access-key: ${AWS_S3_ACCESS_KEY:}
      secret-key: ${AWS_S3_SECRET_KEY:}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}
  jwt:
    secret: ${JWT_SECRET:discodeit-jwt-secret-key-for-sprint10}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800}
  admin:
    email: ${ADMIN_EMAIL:admin@discodeit.com}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin1234}

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,loggers"
  info:
    env:
      enabled: true

info:
  app:
    name: "Discodeit"
    version: "0.0.1-SNAPSHOT"
  java:
    version: "17"
  spring:
    boot:
      version: "3.5.14"
  config:
    datasource:
      url: "${spring.datasource.url}"
      driver-class-name: "${spring.datasource.driver-class-name}"
    jpa:
      ddl-auto: "${spring.jpa.hibernate.ddl-auto}"
    storage:
      type: "${discodeit.storage.type}"
      path: "${discodeit.storage.local.root-path}"
    multipart:
      max-file-size: "${spring.servlet.multipart.max-file-size}"
      max-request-size: "${spring.servlet.multipart.max-request-size}"