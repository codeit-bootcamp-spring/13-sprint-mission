spring:
  application:
    name: discodeit
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

file:
  path:
    user: data/users.ser
    channel: data/channel.ser
    message: data/message.ser
    userStatus: data/userStatus.ser
    readStatus: data/readStatus.ser
    binaryContent: data/binaryContent.ser

discodeit:
  repository:
    type: file