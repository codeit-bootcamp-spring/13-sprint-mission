spring:
  application:
    name: discodeit
  servlet:
    multipart:
      max-file-size: 10MB # 파일 하나의 최대 크기
      max-request-size: 30MB # 한 번에 최대 업로드 가능 용량

server:
  port: 8080

# application.yaml
discodeit:
  repository:
    type: file   # jcf(메모리에 저장) | file(파일에 저장)
  #type: jcf
  storage:
    root-path: file-data-map
    extension: .ser