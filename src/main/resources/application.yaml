spring:
  application:
    name: discodeit
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # 데이터베이스 스키마 검증, 엔티티 모델과 일치하지 않는 경우 오류 발생
    show-sql: true # 실행되는 SQL을 콘솔에 출력
    properties:
      hibernate:
        format_sql: true # SQL을 보기 좋게 들여쓴다
    # 데이터베이스 환경 설정

discodeit:
  storage:
    type: local
    local:
      root-path: .storage

# application.yml
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true


server:
  port: 8080

# 로깅 설정
logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug # 실행되는 SQL
    org.hibernate.orm.jdbc.bind: trace # ? 자리에 채워지는 실제 값(바인딩)

