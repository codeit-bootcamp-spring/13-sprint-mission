spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: discodeit
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  profiles:
    active: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB

discodeit:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      region: ${AWS_S3_REGION:ap-northeast-2}
      bucket: ${AWS_S3_BUCKET:}
      profile: ${AWS_PROFILE:discodeit}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600}

springdoc:
  swagger-ui:
    path: /swagger-ui.html       # Swagger UI 접근 경로
    operations-sorter: method    # HTTP 메서드 순으로 정렬
    tags-sorter: alpha           # 태그 알파벳 순 정렬
    display-request-duration: true
  api-docs:
    path: /v3/api-docs           # OpenAPI 스펙(JSON) 경로

logging:
  level:
    com.discodeit: info
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: trace

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  info:
    env:
      enabled: true

info:
  app:
    name: Discodeit
    version: 1.7.0
    java-version: 17
    spring-boot-version: 3.4.0
  configuration:
    datasource:
      url: ${spring.datasource.url}
      driver-class-name: ${spring.datasource.driver-class-name}
    jpa:
      ddl-auto: ${spring.jpa.hibernate.ddl-auto}
    storage:
      type: ${discodeit.storage.type}
      path: ${discodeit.storage.local.root-path}
    multipart:
      max-file-size: ${spring.servlet.multipart.max-file-size}
      max-request-size: ${spring.servlet.multipart.max-request-size}
