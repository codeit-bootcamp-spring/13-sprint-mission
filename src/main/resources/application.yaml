spring:
  application:
    name: discodeit

  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: none

discodeit:
  repository:
    type: jcf     # jcf | file
    file-directory: data

logging:
  level:
    com.sprintlog: debug
