spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100



  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: discodeit

#파일 저장 방식 변경 설정
discodeit:
  storage:
    type: local
    local:
      root-path: .discodeit/data

logging:
  level:
    com.discodeit: debug
