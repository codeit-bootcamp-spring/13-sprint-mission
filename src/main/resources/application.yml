spring:
  application:
    # 애플리케이션 식별 이름
    name: discodeit
  boot:
    admin:
      client:
        instance:
          name: discodeit

  profiles:
    # 별도 프로파일을 지정하지 않으면 개발 환경 적용
    default: dev

  jpa:
    # 컨트롤러 계층에서 지연 로딩이 발생하지 않도록 OSIV 비활성화
    open-in-view: false
    properties:
      hibernate:
        # 지연 로딩 시 배치 조회를 적용해 N+1 문제 완화
        default_batch_fetch_size: 100
        # 동일한 형태의 DML을 JDBC batch로 묶어 전송
        jdbc:
          batch_size: 50
        # 같은 SQL 템플릿의 insert/update를 최대한 연속 배치로 묶도록 정렬
        order_inserts: true
        order_updates: true

  flyway:
    # 애플리케이션 실행 시 DB 마이그레이션 적용
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # 파일 업로드 크기 제한
      max-file-size: 10MB
      max-request-size: 20MB

springdoc:
  api-docs:
    # OpenAPI 명세 제공 경로
    path: /v3/api/docs

  swagger-ui:
    # Swagger UI 설정
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    # 기본 로그 레벨
    root: info
    # 기본 환경에서는 Hibernate batch 내부 동작을 상세 출력하지 않음
    org.hibernate.orm.jdbc.batch: info

management:
  endpoints:
    web:
      exposure:
        # 외부에 노출할 Actuator 엔드포인트
        include:
          - health
  endpoint:
    health:
      show-details: never

  info:
    env:
      # info.* 설정을 /actuator/info 응답에 포함
      enabled: true
discodeit:
  security:
    remember-me:
      # Remember-Me 쿠키 서명에 사용하는 비밀 키
      key: ${REMEMBER_ME_KEY}
      # 기본 유효기간: 30일
      token-validity-seconds: 2592000
  storage:
    # 파일 저장 방식과 경로를 환경변수로 설정
    type: ${STORAGE_TYPE:local}
    local:
      root-path: ${STORAGE_LOCAL_ROOT_PATH:.discodeit/storage}
    s3:
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      endpoint: ${AWS_S3_ENDPOINT:}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION:600} # (기본값: 10분)
  admin:
    user:
      username: ${ADMIN_USER_NAME}
      password: ${ADMIN_USER_PASSWORD}
      email: ${ADMIN_USER_EMAIL}

info:
  application:
    # Actuator에 표시할 애플리케이션 정보
    name: Discodeit
    version: 1.7.0

  datasource:
    url: ${spring.datasource.url}
    driver-class-name: ${spring.datasource.driver-class-name}

  jpa:
    ddl-auto: ${spring.jpa.hibernate.ddl-auto}

  storage:
    type: ${discodeit.storage.type}
    path: ${discodeit.storage.local.root-path}

  multipart:
    max-file-size: ${spring.servlet.multipart.max-file-size}
    max-request-size: ${spring.servlet.multipart.max-request-size}
