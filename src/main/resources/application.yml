spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  application:
    name: discodeit
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

#파일 저장 방식 변경 설정
discodeit:
  storage:
    type: local
    local:
      root-path: .discodeit/data
logging:
  level:
    root: info

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true
info:
  app:
    name: Discodeit
    version: 1.7.0
  java:
    version: 17
  spring-boot:
    version: 3.4.0