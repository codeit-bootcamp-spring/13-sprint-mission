spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: discodeit
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

#파일 저장 방식 변경 설정
discodeit:
  storage:
    type: local
    local:
      root-path: .discodeit/data
logging:
  level:
    root: info