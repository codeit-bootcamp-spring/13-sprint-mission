# 개발 환경

server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true # H2 콘솔 활성화
  jpa:
    hibernate:
      ddl-auto: create-drop # 시작할 때 테이블 생성하고 종료할 때 삭제
    show-sql: true

    properties:
      hibernate:
        format_sql: true # SQL을 보기 좋게 들여쓴다

# 로깅 설정
logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug # 실행되는 SQL
    org.hibernate.orm.jdbc.bind: trace # ? 자리에 채워지는 실제 값(바인딩)
