spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USER}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Spring admin 클라이언트 등록용 설정.
#  boot:
#    admin:
#      client:
#        url: http://localhost:9090


logging:
  level:
    com.sprint.mission.discodeit: debug
    com.sprint.mission.discodeit.config.SecurityConfig: trace # dev 프로파일에서 Security 로그 tace
    org.hiberate.SQL: INFO
    org.hibernate.orm.connections.access: DEBUG # 접속 정보 확인
    org.hibernate.orm.jdbc.bind: INFO