server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/discodeit}
    username: ${DB_USERNAME:discodeit_user}
    password: ${DB_PASSWORD:discodeit1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: info

    # 우리가 작성한 프로젝트
    com.sprint.mission.discodeit: debug

    # 기존 SQL 로그 유지
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace