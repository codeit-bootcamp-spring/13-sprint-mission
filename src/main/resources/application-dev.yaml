spring:
  datasource:
    url: jdbc:h2:mem:discodeit;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
server:
  port: 8080

discodeit:
  welcome-message: "discodeit - dev환경"

logging:
  level:
    com.sprint.mission.discodeit: debug