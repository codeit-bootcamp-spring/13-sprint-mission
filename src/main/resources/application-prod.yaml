spring:
  application:
    name: discodeit

  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_CLIENT_URL}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.sprint.mission.discodeit: info
