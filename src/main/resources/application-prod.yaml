spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USER}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  # Spring admin config
#  boot:
#    admin:
#      client:
#        url:

logging:
  level:
    com.sprint.mission.discodeit: warn
    org.hibernate.SQL: info
    org.hibernate.orm.jdbc.bind: info