# 운영 환경

server:
  port: 80

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/discodeit
    username: discodeit_user
    password: discodeit1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # 변경은 하지 않고 스키마 검증만
    show-sql: false

logging:
  level:
    com.sprint.mission.discodeit: info
    org.hibernate.orm.jdbc.bind: trace # ? 자리에 채워지는 실제 값(바인딩)

