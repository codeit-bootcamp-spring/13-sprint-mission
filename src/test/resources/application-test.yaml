spring:
  datasource:
    # H2 인메모리 DB + PostgreSQL 호환 모드
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # 테스트 시작 시 Entity 기반으로 스키마 생성, 종료 시 삭제
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

  sql:
    init:
      mode: never

# Swagger 비활성화 (불필요한 빈 로딩 방지)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.sprint.mission.discodeit: debug
    org.hibernate.SQL: debug

# BinaryContentStorage Bean 생성을 위한 설정
discodeit:
  storage:
    type: local
    local:
      root-path: .discodeit/test-storage