# test 전용 설정. 테스트 클래스에서 이 설정을 불러오는 로직을 따로 작성해서 적용.

spring:
  datasource:
    url: jdbc:h2:mem:discodeit;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

    properties:
      hibernate:
      # generate_statistics: true # 쿼리 수 검증(N+1 검증)용

  # .sql 파일을 이용하지 않고, hibernate 가 DDL 을 작성하도록 설정.
  sql:
    init:
      mode: never

# 3. 테스트 시 로그 레벨 조절 (지저분한 로그 방지)
logging:
  level:
    root: INFO
    com.sprintlog: DEBUG # 우리 패키지만 상세히



