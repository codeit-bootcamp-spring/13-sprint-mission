spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop # 테스트 시작 시 테이블을 생성하고 완료되면 드롭
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.sprint.mission.discodeit: DEBUG # 패키지는 상세하게
    org.hibernate.sql: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

discodeit:
  storage:
    type: local
    local:
      root-path: .storage-test