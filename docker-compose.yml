services:
  postgres:
    image: postgres:17
    container_name: discodeit-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: discodeit-app

    depends_on:
      - postgres

    environment:
      SPRING_PROFILES_ACTIVE: dev

      # PostgreSQL
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      # BinaryContentStorage
      STORAGE_TYPE: s3
      STORAGE_LOCAL_ROOT_PATH: /app/storage

      # AWS S3
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY}
      AWS_S3_REGION: ${AWS_S3_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_S3_PRESIGNED_URL_EXPIRATION: ${AWS_S3_PRESIGNED_URL_EXPIRATION}

    ports:
      - "8081:8080"

    volumes:
      - binary-content-storage:/app/storage

volumes:
  postgres-data:
  binary-content-storage: